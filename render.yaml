services:
  - type: web
    name: wetrade-backend
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: STARTING_BALANCE_INR
        value: "100000.0"
      - key: MAX_QUOTE_AGE_SECONDS
        value: "60"
      - key: DEFAULT_SLIPPAGE_BPS
        value: "5.0"
